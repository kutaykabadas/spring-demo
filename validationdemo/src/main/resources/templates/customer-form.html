<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>Customer Form</title>
	<style>
		.form-group {
			display: flex;
			align-items: center;
			margin-bottom: 12px;
		}

		.form-group label {
			width: 150px;
			margin-right: 10px;
		}

		.form-group input {
			width: 250px;
			padding: 4px;
			margin-right: 10px;
		}

		.error {
			color: red;
			font-size: 0.9em;
			white-space: nowrap;
			max-width: 200px;
		}

		form {
			margin-left: 0;
		}
	</style>
</head>

<body>

	<i>Fill out the form. Asterisk (*) means required</i>
	<br><br>

	<form th:action="@{/processForm}" th:object="${customer}" method="POST">

		<div class="form-group">
			<label>First Name:</label>
			<input type="text" th:field="${customer.firstName}" />
		</div>

		<div class="form-group">
			<label>Last Name (*):</label>
			<input type="text" th:field="${customer.lastName}" />
			<span th:if="${#fields.hasErrors('lastName')}" th:errors="${customer.lastName}" class="error"></span>
		</div>

		<div class="form-group">
			<label>Free Passes (*):</label>
			<input type="text" th:field="${customer.freePasses}" />
			<span th:if="${#fields.hasErrors('freePasses')}" th:errors="${customer.freePasses}" class="error"></span>
		</div>

		<div class="form-group">
			<label>Postal Code:</label>
			<input type="text" th:field="${customer.postalCode}" />
			<span th:if="${#fields.hasErrors('postalCode')}" th:errors="${customer.postalCode}" class="error"></span>
		</div>

		<div class="form-group">
			<label>Course Code:</label>
			<input type="text" th:field="${customer.courseCode}" />
			<span th:if="${#fields.hasErrors('courseCode')}" th:errors="${customer.courseCode}" class="error"></span>
		</div>

		<div class="form-group">
			<label></label>
			<input type="submit" value="Submit" />
		</div>

	</form>
</body>

</html>
